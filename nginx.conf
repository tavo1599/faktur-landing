server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida devuelve index.html (vue-router history)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache larga para los assets con hash (js/css/imágenes de /assets)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Compresión
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
